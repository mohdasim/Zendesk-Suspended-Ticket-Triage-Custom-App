<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suspended Tickets Triage Center</title>

  <!-- Zendesk Garden CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zendeskgarden/css-bedrock@8/dist/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zendeskgarden/css-buttons@8/dist/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zendeskgarden/css-forms@8/dist/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zendeskgarden/css-tables@8/dist/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zendeskgarden/css-tags@8/dist/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zendeskgarden/css-utilities@8/dist/index.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="u-p-sm">
    <!-- Header -->
    <div class="app-header">
      <div class="app-header__title">
        <svg class="app-header__icon" viewBox="0 0 16 16" width="18" height="18">
          <path fill="currentColor" d="M8 1a7 7 0 110 14A7 7 0 018 1zm0 1.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM8 4a.75.75 0 01.75.75v2.5h2.5a.75.75 0 010 1.5h-2.5v2.5a.75.75 0 01-1.5 0v-2.5h-2.5a.75.75 0 010-1.5h2.5v-2.5A.75.75 0 018 4z"/>
        </svg>
        <h1>Suspended Tickets Triage</h1>
      </div>
      <div class="app-header__sync" id="syncStatus">
        <span class="app-header__sync-text" id="syncText">Loading...</span>
        <button class="c-btn c-btn--basic c-btn--sm app-header__refresh" id="refreshBtn" title="Refresh">
          <svg viewBox="0 0 16 16" width="14" height="14">
            <path fill="currentColor" d="M13.65 2.35A7.96 7.96 0 008 0a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L10 6h6V0l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="app-search u-mt-xs">
      <div class="c-txt">
        <input class="c-txt__input c-txt__input--sm" id="searchInput" type="search" placeholder="Search tickets by subject, author, or content..." autocomplete="off">
      </div>
    </div>

    <!-- Progress Bar (shown during first load) -->
    <div class="app-progress u-mt-xs" id="progressContainer" style="display:none;">
      <div class="app-progress__bar">
        <div class="app-progress__fill" id="progressFill" style="width:0%"></div>
      </div>
      <span class="app-progress__text" id="progressText">Loading suspended tickets...</span>
    </div>

    <!-- Tab Navigation -->
    <div class="app-tabs u-mt-xs">
      <button class="app-tabs__tab app-tabs__tab--active" data-tab="dashboard">Dashboard</button>
      <button class="app-tabs__tab" data-tab="tickets">Tickets</button>
      <button class="app-tabs__tab" data-tab="log">Activity Log</button>
    </div>

    <!-- Dashboard Tab -->
    <div class="app-tab-content" id="tab-dashboard">
      <!-- Summary Cards -->
      <div class="app-summary u-mt-sm" id="summaryCards">
        <div class="app-summary__card">
          <div class="app-summary__value" id="totalCount">0</div>
          <div class="app-summary__label">Total</div>
        </div>
        <div class="app-summary__card app-summary__card--spam">
          <div class="app-summary__value" id="spamCount">0</div>
          <div class="app-summary__label">Spam</div>
        </div>
        <div class="app-summary__card app-summary__card--auto">
          <div class="app-summary__value" id="autoCount">0</div>
          <div class="app-summary__label">Automated</div>
        </div>
        <div class="app-summary__card app-summary__card--other">
          <div class="app-summary__value" id="otherCount">0</div>
          <div class="app-summary__label">Other</div>
        </div>
      </div>

      <!-- Repeat Offenders -->
      <div class="app-section u-mt-sm" id="repeatOffendersSection" style="display:none;">
        <h3 class="app-section__title">Repeat Offenders</h3>
        <div id="repeatOffendersList" class="app-repeat-offenders"></div>
      </div>

      <!-- Trend Chart -->
      <div class="app-section u-mt-sm">
        <h3 class="app-section__title">Suspension Trend (Last 30 Days)</h3>
        <div class="app-chart-container">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <!-- Cause Breakdown -->
      <div class="app-section u-mt-sm">
        <h3 class="app-section__title">Causes Breakdown</h3>
        <div class="app-chart-container app-chart-container--doughnut">
          <canvas id="causeChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Tickets Tab -->
    <div class="app-tab-content" id="tab-tickets" style="display:none;">
      <!-- Filter Bar -->
      <div class="app-filters u-mt-sm">
        <div class="c-txt">
          <select class="c-txt__input c-txt__input--select c-txt__input--sm" id="causeFilter">
            <option value="">All Causes</option>
          </select>
        </div>
        <div class="c-txt">
          <select class="c-txt__input c-txt__input--select c-txt__input--sm" id="sortFilter">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="subject">Subject A-Z</option>
          </select>
        </div>
      </div>

      <!-- Bulk Actions -->
      <div class="app-bulk-actions u-mt-xs" id="bulkActions">
        <label class="c-chk u-mr-sm">
          <input class="c-chk__input" type="checkbox" id="selectAll">
          <span class="c-chk__label">Select All</span>
        </label>
        <span class="app-bulk-actions__count" id="selectedCount" style="display:none;">0 selected</span>
        <div class="app-bulk-actions__buttons">
          <button class="c-btn c-btn--primary c-btn--sm" id="recoverBtn" disabled>Recover</button>
          <button class="c-btn c-btn--danger c-btn--sm" id="deleteBtn" disabled>Delete</button>
          <button class="c-btn c-btn--basic c-btn--sm" id="exportCsvBtn" title="Export to CSV">
            <svg viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M8 10l-4-4h3V1h2v5h3L8 10zm6 2v2H2v-2H0v4h16v-4h-2z"/></svg>
            CSV
          </button>
        </div>
      </div>

      <!-- Ticket List (virtual scroll container) -->
      <div class="app-ticket-list" id="ticketListContainer">
        <div class="app-ticket-list__scroll" id="ticketListScroll">
          <div class="app-ticket-list__spacer" id="ticketListSpacer"></div>
          <div class="app-ticket-list__items" id="ticketListItems"></div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="app-empty" id="emptyState" style="display:none;">
        <svg viewBox="0 0 48 48" width="48" height="48">
          <path fill="#d8dcde" d="M24 4C12.95 4 4 12.95 4 24s8.95 20 20 20 20-8.95 20-20S35.05 4 24 4zm0 36c-8.84 0-16-7.16-16-16S15.16 8 24 8s16 7.16 16 16-7.16 16-16 16zm-2-22h4v12h-4V18zm0 16h4v4h-4v-4z"/>
        </svg>
        <p id="emptyText">No suspended tickets found.</p>
      </div>
    </div>

    <!-- Activity Log Tab -->
    <div class="app-tab-content" id="tab-log" style="display:none;">
      <div class="app-log-header u-mt-sm">
        <h3 class="app-section__title">Action History (Last 30 Days)</h3>
        <button class="c-btn c-btn--basic c-btn--sm" id="exportLogBtn">Export Log</button>
      </div>
      <div class="app-log-list" id="logList">
        <div class="app-empty">
          <p>No actions recorded yet.</p>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="app-modal" id="confirmModal" style="display:none;">
      <div class="app-modal__backdrop"></div>
      <div class="app-modal__dialog">
        <div class="app-modal__header">
          <h3 id="modalTitle">Confirm Action</h3>
        </div>
        <div class="app-modal__body">
          <p id="modalMessage">Are you sure?</p>
        </div>
        <div class="app-modal__footer">
          <button class="c-btn c-btn--basic c-btn--sm" id="modalCancel">Cancel</button>
          <button class="c-btn c-btn--sm" id="modalConfirm">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Notification -->
    <div class="app-notification" id="notification" style="display:none;">
      <span id="notificationText"></span>
    </div>

    <!-- Ticket Preview Drawer -->
    <div class="app-preview" id="ticketPreview" style="display:none;">
      <div class="app-preview__header">
        <h3 id="previewSubject"></h3>
        <button class="c-btn c-btn--basic c-btn--sm" id="previewClose">&times;</button>
      </div>
      <div class="app-preview__meta" id="previewMeta"></div>
      <div class="app-preview__content" id="previewContent"></div>
      <div class="app-preview__actions">
        <button class="c-btn c-btn--primary c-btn--sm" id="previewRecover">Recover</button>
        <button class="c-btn c-btn--danger c-btn--sm" id="previewDelete">Delete</button>
      </div>
    </div>
  </div>

  <!-- ZAF SDK -->
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>

  <!-- App Scripts -->
  <script src="js/cache.js"></script>
  <script src="js/api.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/search.js"></script>
  <script src="js/virtual-list.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
